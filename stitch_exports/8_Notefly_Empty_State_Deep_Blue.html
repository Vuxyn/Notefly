<!-- Tabs -->

<button class="pb-3 px-1 text-primary border-b-2 border-primary font-label-sm text-label-sm transition-all">

<button class="pb-3 px-1 text-secondary font-label-sm text-label-sm hover:text-primary transition-all">

<button class="pb-3 px-1 text-secondary font-label-sm text-label-sm hover:text-primary transition-all">

<script>
        // Simple micro-interaction for the bottom sheet handle
        const bottomSheet = document.querySelector('.bottom-sheet-overlay');
        let startY = 0;
        
        document.querySelector('.w-10.h-1.bg-secondary-fixed').addEventListener('click', () => {
           alert('This would minimize the notes panel in a real app.');
        });

        // Add a focus state to the input
        const mainInput = document.querySelector('input');
        mainInput.addEventListener('focus', () => {
            mainInput.parentElement.classList.add('bg-surface');
            mainInput.parentElement.classList.remove('bg-surface-container-low');
        });
        mainInput.addEventListener('blur', () => {
            mainInput.parentElement.classList.remove('bg-surface');
            mainInput.parentElement.classList.add('bg-surface-container-low');
        });
    </script>
