<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Notefly - Active Notes</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#121c2a",
                        "tertiary-fixed": "#89f5e7",
                        "background": "#f8f9ff",
                        "on-tertiary": "#ffffff",
                        "secondary": "#5c5f60",
                        "secondary-fixed-dim": "#c5c6c8",
                        "surface-dim": "#d0dbed",
                        "surface": "#f8f9ff",
                        "on-secondary-fixed": "#191c1e",
                        "on-secondary-container": "#606365",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "outline": "#6b7a76",
                        "inverse-on-surface": "#eaf1ff",
                        "on-secondary-fixed-variant": "#444749",
                        "surface-container-low": "#eff4ff",
                        "surface-bright": "#f8f9ff",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#006b5f",
                        "on-primary-fixed": "#00201c",
                        "surface-variant": "#d9e3f6",
                        "on-primary-fixed-variant": "#005047",
                        "surface-container-high": "#dee9fc",
                        "outline-variant": "#bacac5",
                        "on-tertiary-container": "#00574f",
                        "surface-container-lowest": "#ffffff",
                        "secondary-container": "#dee0e2",
                        "primary-fixed-dim": "#3cddc7",
                        "tertiary-container": "#62d0c2",
                        "primary-fixed": "#62fae3",
                        "on-error-container": "#93000a",
                        "primary": "#006b5f",
                        "surface-container-highest": "#d9e3f6",
                        "inverse-primary": "#3cddc7",
                        "error": "#ba1a1a",
                        "tertiary": "#006a61",
                        "surface-container": "#e6eeff",
                        "primary-container": "#2dd4bf",
                        "on-primary-container": "#00574d",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#005049",
                        "on-tertiary-fixed": "#00201d",
                        "tertiary-fixed-dim": "#6bd8cb",
                        "secondary-fixed": "#e1e2e4",
                        "on-background": "#121c2a",
                        "on-surface-variant": "#3c4a46",
                        "inverse-surface": "#27313f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "lg": "24px",
                        "margin-mobile": "20px",
                        "xl": "32px",
                        "base": "4px",
                        "md": "16px",
                        "gutter-mobile": "12px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display": ["44px", { "lineHeight": "52px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background min-h-screen flex flex-col font-body-md text-on-background">
<!-- Top App Bar -->
<header class="bg-surface dark:bg-surface-container rounded-t-xl flex items-center justify-between px-md py-sm w-full sticky top-0 z-50">
<button aria-label="Close" class="text-on-surface-variant dark:text-on-secondary-fixed-variant hover:bg-surface-variant/50 dark:hover:bg-surface-variant/20 p-2 rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md font-semibold text-primary dark:text-primary-fixed">Notefly</h1>
<button aria-label="More options" class="text-on-surface-variant dark:text-on-secondary-fixed-variant hover:bg-surface-variant/50 dark:hover:bg-surface-variant/20 p-2 rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-margin-mobile pt-sm pb-xl relative">
<!-- Empty State Container -->
<div class="flex-grow flex flex-col items-center justify-center text-center pb-24">
<div class="w-64 h-64 mb-lg relative">
<!-- Using the requested image placeholder -->
<img alt="No active notes illustration" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBwY7B7ZK_0Gv6DlaAkXKVeclfNnVNNYZDwGivLEo6pGFNbMNMEphDRwHIfIF-QbyvSCz7mpBZFLUB9By3Samzn4XQlhvHl_DT94A-eUxnO295DgthI41lS-jvpZnYXfQldGk0Aoc-k6ShAOHuDiffpanoFbcaseGHTYa9okcInPokFBuivBEwsMzb0_j9oBqxBKLgpVtW9lfmp1nEz7EmhMToNc3WL2dOVioVTKP1UPCU5i75ChWzuJ7Y0YNuH55mmH572ysXtrsgM"/>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">No active notes</h2>
<p class="font-body-md text-body-md text-secondary">All caught up!</p>
</div>
</main>
<!-- Add Note Input (Sticky above Bottom Nav on mobile) -->
<div class="fixed bottom-[80px] w-full px-margin-mobile z-40 md:hidden">
<div class="bg-surface-container-lowest rounded-full shadow-sm border border-surface-variant flex items-center px-4 py-2 focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container transition-all">
<input class="flex-grow bg-transparent border-none outline-none font-body-md text-body-md text-on-surface placeholder-secondary focus:ring-0" placeholder="Add a note..." type="text"/>
<button aria-label="Add note" class="text-primary-container p-2 hover:bg-surface-variant/50 rounded-full transition-colors">
<span class="material-symbols-outlined" data-icon="send">send</span>
</button>
</div>
</div>
<!-- Bottom Navigation Bar (Mobile) -->
<nav class="bg-surface-container-low dark:bg-surface-container-high border-t border-outline-variant dark:border-outline fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 md:hidden">
<!-- Inactive Tab: All -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-secondary-fixed-dim px-4 py-1 hover:bg-secondary-container dark:hover:bg-on-secondary-fixed-variant rounded-xl transition-all duration-200">
<span class="material-symbols-outlined mb-1" data-icon="list_alt">list_alt</span>
<span class="font-label-md text-label-md">All</span>
</button>
<!-- Active Tab: Active -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 hover:bg-secondary-container dark:hover:bg-on-secondary-fixed-variant active:scale-98 transition-all duration-200">
<span class="material-symbols-outlined mb-1" data-icon="sticky_note_2" data-weight="fill" style="font-variation-settings: 'FILL' 1;">sticky_note_2</span>
<span class="font-label-md text-label-md font-bold">Active</span>
</button>
<!-- Inactive Tab: Done -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-secondary-fixed-dim px-4 py-1 hover:bg-secondary-container dark:hover:bg-on-secondary-fixed-variant rounded-xl transition-all duration-200">
<span class="material-symbols-outlined mb-1" data-icon="check_circle">check_circle</span>
<span class="font-label-md text-label-md">Done</span>
</button>
</nav>
<!-- Floating Action Button (Desktop Only) -->
<button aria-label="Add note" class="hidden md:flex fixed bottom-lg right-lg bg-primary-container text-on-primary-container w-14 h-14 rounded-2xl shadow-md items-center justify-center hover:bg-primary hover:text-on-primary transition-all active:scale-95 z-50">
<span class="material-symbols-outlined text-2xl" data-icon="add">add</span>
</button>
</body></html>
