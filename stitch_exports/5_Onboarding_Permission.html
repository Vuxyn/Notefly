        }

                One permission needed
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
                Notefly needs overlay permission to float above other apps. We promise that's all.
            </p>
</div>
</main>
<!-- Bottom Action Section -->
<footer class="w-full max-w-md px-margin-mobile pb-xl flex flex-col items-center gap-xl fade-up" style="animation-delay: 0.2s;">

</button>
</footer>
<!-- BottomNavBar (Suppressed for Onboarding as per "Semantic Shell" mandate) -->
<!-- Micro-interactions Script -->
<script>
        // Simple press feedback logic
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', function() {
                this.style.transform = 'scale(0.97)';
            });
            button.addEventListener('mouseup', function() {
                this.style.transform = 'scale(1)';
            });
            button.addEventListener('mouseleave', function() {
                this.style.transform = 'scale(1)';
            });
        });
    </script>
