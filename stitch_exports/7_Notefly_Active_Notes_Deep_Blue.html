<body class="bg-background text-on-surface min-h-screen overflow-hidden">
<!-- Background Content (Dimmed) -->

<!-- TopAppBar Placeholder behind overlay -->
<header class="bg-surface dark:bg-surface text-primary font-headline-md text-headline-md w-full top-0 sticky flex items-center justify-between px-container-margin py-4">
<div class="flex items-center gap-4">

</div>
<span class="material-symbols-outlined cursor-pointer">notifications</span>
</header>
<!-- Main Content Canvas (Background) -->
<div class="px-container-margin py-stack-gap space-y-6">
<div class="rounded-xl bg-surface-container-low p-6 space-y-4">
<div class="h-4 w-2/3 bg-surface-variant rounded-full opacity-30"></div>
<div class="h-3 w-full bg-surface-variant rounded-full opacity-20"></div>
<div class="h-3 w-5/6 bg-surface-variant rounded-full opacity-20"></div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="h-32 bg-surface-container rounded-xl opacity-30"></div>
<div class="h-32 bg-surface-container rounded-xl opacity-30"></div>
</div>
</div>
<!-- Dim Overlay -->
<div class="dim-overlay absolute inset-0 z-10"></div>
</main>
<!-- Bottom Sheet (Active State) -->
<div class="bottom-sheet fixed bottom-0 left-0 right-0 h-[70%] bg-surface-container-lowest z-30 rounded-t-[24px] shadow-[0_-4px_25px_rgba(0,0,0,0.1)] flex flex-col">
<!-- Handle Indicator -->
<div class="w-full flex justify-center py-3">
<div class="w-10 h-1 bg-outline-variant rounded-full"></div>
</div>
<!-- Header -->
<div class="px-container-margin flex items-center justify-between pb-4">
<h2 class="font-headline-md text-headline-md text-on-surface">Notefly</h2>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-secondary">close</span>
</button>
</div>
<!-- Tabs -->
<div class="px-container-margin flex gap-6 border-b border-surface-variant/50">
<button class="pb-2 font-label-caps text-label-caps text-primary border-b-2 border-primary transition-all">
                ALL
            </button>
<button class="pb-2 font-label-caps text-label-caps text-secondary hover:text-on-surface transition-all">
                ACTIVE
            </button>
<button class="pb-2 font-label-caps text-label-caps text-secondary hover:text-on-surface transition-all">
                DONE
            </button>
</div>
<!-- List Section (Scrollable) -->
<div class="flex-grow overflow-y-auto custom-scrollbar px-container-margin py-4 space-y-2">
<!-- Item 1: Unchecked -->

</div>

</div>
<!-- Item 2: Checked -->
<div class="note-item flex items-center gap-4 py-3 rounded-lg">
<div class="w-6 h-6 rounded-md bg-primary flex items-center justify-center cursor-pointer transition-colors">
<span class="material-symbols-outlined text-[18px] text-white" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<p class="font-body-lg text-body-lg text-secondary line-through italic">Finish project proposal</p>
</div>
<!-- Item 3: Unchecked -->
<div class="note-item flex items-center gap-4 py-3 rounded-lg">
<div class="w-6 h-6 rounded-md border-2 border-outline-variant flex items-center justify-center cursor-pointer hover:border-primary transition-colors">

</div>

</div>
</div>
</div>

</button>

<div class="flex flex-col items-center justify-center text-primary relative after:content-[''] after:absolute after:-bottom-1 after:w-1 after:h-1 after:bg-primary after:rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">description</span>
</div>

<span class="material-symbols-outlined">label</span>
</div>
<div class="flex flex-col items-center justify-center text-secondary">
<span class="material-symbols-outlined">archive</span>
</div>
<div class="flex flex-col items-center justify-center text-secondary">
<span class="material-symbols-outlined">settings</span>
</div>

<script>
        // Simple micro-interaction for checkboxes
        document.querySelectorAll('.note-item').forEach(item => {
            item.addEventListener('click', () => {
                const checkbox = item.querySelector('.material-symbols-outlined');
                const text = item.querySelector('p');
                const box = checkbox.parentElement;

                if (box.classList.contains('bg-primary')) {
                    // Uncheck
                    box.classList.remove('bg-primary');
                    box.classList.add('border-2', 'border-outline-variant');
                    checkbox.classList.add('opacity-0');
                    checkbox.style.fontVariationSettings = "'FILL' 0";
                    text.classList.remove('line-through', 'italic', 'text-secondary');
                    text.classList.add('text-on-surface');
                } else {
                    // Check
                    box.classList.add('bg-primary');
                    box.classList.remove('border-2', 'border-outline-variant');
                    checkbox.classList.remove('opacity-0');
                    checkbox.style.fontVariationSettings = "'FILL' 1";
                    checkbox.classList.add('text-white');
                    text.classList.add('line-through', 'italic', 'text-secondary');
                    text.classList.remove('text-on-surface');
                }
            });
        });

        // Close logic simulation
        document.querySelector('.bottom-sheet button').addEventListener('click', () => {
            document.querySelector('.bottom-sheet').style.transform = 'translateY(100%)';
            document.querySelector('.dim-overlay').style.opacity = '0';
            setTimeout(() => {
                document.querySelector('.dim-overlay').style.display = 'none';
            }, 400);
        });
    </script>
