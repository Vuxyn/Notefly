<style>
        .ripple-effect {
            position: relative;
            overflow: hidden;
        }
        .ripple-effect::after {
            content: "";
            display: block;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            background-image: radial-gradient(circle, #fff 10%, transparent 10.01%);
            background-repeat: no-repeat;
            background-position: 50%;
            transform: scale(10, 10);
            opacity: 0;
            transition: transform .5s, opacity 1s;
        }
        .ripple-effect:active::after {
            transform: scale(0, 0);
            opacity: .3;
            transition: 0s;
        }
        .floating-anim {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background font-body-md text-on-background selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col items-center justify-between">
<!-- Top App Bar (As per JSON configuration, using for identity but hidden/suppressed logic applies for onboarding) -->
<!-- Suppression logic: Onboarding page, header usually simplified or removed -->
<header class="w-full top-0 left-0 flex items-center justify-center px-margin-mobile h-16 bg-transparent">
<div class="font-display text-headline-md-mobile font-bold text-primary">Clarify</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 w-full max-w-md flex flex-col items-center px-margin-mobile pt-xl">
<!-- Illustration Container -->
<div class="w-full aspect-square relative flex items-center justify-center mb-xl floating-anim">
<!-- Bubble Glow effect -->
<div class="absolute inset-0 bg-primary opacity-5 blur-[100px] rounded-full scale-75"></div>
<!-- Core Illustration -->
<div class="relative w-full h-full max-w-[280px]">
<img class="w-full h-full object-contain drop-shadow-xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB6iUFyki5l5o8Lp01ApDooCpYq6wazhMkz39KnaI4X-V3D9WwDMGgffJteNPkfbKOdUsldVgQzu-DZ2K0dMyjoDtm_CHWG4jztXyseAXtta8_Zz75ZiBLzJIfuE5IsXq087AmFwULo3xtyrWYfPMUaIhQBm-aXXyVWxtGGHm4IsJHTcbk0uG9-r_34ulTlqCxaOfA6ZRc-epUoEZSN47KsgJus49KdwMLKRjVYt2fjWmZuyp7PuALrCGVa9Jzs8YX6eeJ8kuksyPKh"/>
</div>
</div>
<!-- Text Content -->
<div class="text-center space-y-md fade-in-up">
<h1 class="font-display text-headline-lg-mobile text-on-surface tracking-tight">
                Your notes, always on top
            </h1>
<p class="font-body-lg text-secondary px-base leading-relaxed">
                Notefly floats above every app so your notes are always one tap away.
            </p>
</div>
</main>
<!-- Bottom Action Section -->
<footer class="w-full max-w-md px-margin-mobile pb-xl space-y-xl flex flex-col items-center">
<!-- Pagination Dots (Simplified from BottomNavBar JSON intent for Onboarding context) -->
<div class="flex items-center gap-sm">
<!-- Active Dot -->
<div class="w-2.5 h-2.5 rounded-full bg-primary-container shadow-sm shadow-primary/20"></div>
<!-- Inactive Dot -->
<div class="w-2 h-2 rounded-full bg-secondary-container"></div>
<!-- Inactive Dot -->
<div class="w-2 h-2 rounded-full bg-secondary-container"></div>
</div>
<!-- CTA Button -->
<button class="w-full h-[56px] bg-primary text-on-primary rounded-xl font-label-md text-body-lg ripple-effect flex items-center justify-center gap-sm active:scale-[0.98] transition-transform shadow-lg shadow-primary/10" style="background-color: #1e40af;">
<span>Next</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</footer>
<!-- Bottom Navigation Shell (Suppressed for Onboarding as per "Semantic Shell Mandate") -->
<!-- Not rendering BottomNavBar here to prioritize user focus on the onboarding flow -->
<script>
        // Micro-interaction for the CTA button scale down effect and simple click logic
        document.querySelector('button').addEventListener('click', function() {
            // Future navigation logic would go here
            this.classList.add('opacity-80');
            setTimeout(() => {
                this.classList.remove('opacity-80');
            }, 150);
        });

        // Atmospheric parallax effect on mouse move (Desktop only)
        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth > 768) {
                const illustration = document.querySelector('.floating-anim');
                const x = (window.innerWidth / 2 - e.pageX) / 40;
                const y = (window.innerHeight / 2 - e.pageY) / 40;
                illustration.style.transform = `translate(${x}px, ${y}px)`;
            }
        });
    </script>
